name: Functional tests

on: [push]

env:
    COVERAGE: --coverage
    CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
    setup:
        runs-on: ubuntu-26.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - dir: "./apps/"
                    - dir: "./apps/for_amorgos/"
                    - dir: "./apps/XCSP3/"
                      target: "naxos-xcsp3"
                    - dir: "./apps/CELAR/"
                      data: "SCEN06"
                    - dir: "./apps/CELAR/"
                      data: "SCEN07"
                    - dir: "./apps/CELAR/"
                      data: "SCEN08"
                    - dir: "./apps/CELAR/"
                      data: "SCEN09"
                    - dir: "./apps/CELAR/"
                      data: "SCEN10"
                    - dir: "./apps/Hadoop/"
                    - dir: "./apps/ITC/"
                      data: "comp01.ctt"
                      method: "DFS"
                    - dir: "./apps/ITC/"
                      data: "comp02.ctt"
                      method: "LDS"
                    - dir: "./apps/ITC/"
                      data: "comp03.ctt"
                      method: "IBROAD"
                    - dir: "./apps/ITC/"
                      data: "comp04.ctt"
                      method: "PoPS"
                    - dir: "./apps/ITC/"
                      data: "comp05.ctt"
                      method: "DBS"
                    - dir: "./apps/ITC/"
                      data: "comp06.ctt"
                      method: "CREDIT 100"
                    - dir: "./apps/ITC/"
                      data: "comp07.ctt"
                      method: "LAN 20"
                      method_l_s: "DBDS"
                    - dir: "./apps/ITC/"
                      data: "comp08.ctt"
                      method: "BBS 100"
                      method_l_s: "DFS RANDOM_VAR_HEUR"
                    - dir: "./apps/ITC/"
                      data: "comp09.ctt"
                      method: "RDFS 100 1000"
                      method_l_s: "DFS RANDOM_VAR_HEUR"
                    - dir: "./apps/ITC/"
                      data: "comp10.ctt"
                      method: "GNS"
                    - dir: "./apps/ITC/"
                      data: "comp11.ctt"
                      method: "FNS fSample"
                    - dir: "./apps/ITC/"
                      data: "comp12.ctt"
                      method: "FNS fSampleMiddle"
                      method_l_s: "FNS fSampleExp"
                    - dir: "./apps/ITC/"
                      data: "comp13.ctt"
                      method: "ISAMP 1000"
                    - dir: "./apps/ITC/"
                      data: "comp14.ctt"
                      method: "ONESAMP"
        steps:
            - name: Install dependencies
              run: >
                  sudo apt-get update &&
                  sudo apt-get install -y --no-install-recommends
                  valgrind libxml2-dev xz-utils
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              if: matrix.target
              with:
                  distribution: temurin
                  java-version: "11"
            - uses: gradle/actions/setup-gradle@v4
              if: matrix.target
              with:
                  gradle-version: "6.9.4"
            - name: Build
              env:
                  DIRECTORY: ${{ matrix.dir }}
                  TARGET: ${{ matrix.target || null }}
              run: cd $DIRECTORY && cmake . && make -j $TARGET
            - name: Test
              env:
                  DIRECTORY: ${{ matrix.dir }}
                  DATASET: ${{ matrix.data || null }}
                  METHOD: ${{ matrix.method || null }}
                  METHOD_LOCAL_SEARCH: ${{ matrix.method_l_s || null }}
              run: cd $DIRECTORY && ctest -V && cd -
